<!doctype html><html lang="zh-CN"><head><!-- @include head --><title>信息来源 · Luokixi</title><script type="module" src="/src/pages/sources.js"></script></head>
<body data-page="sources" class="ap-page"><!-- @include nav --><main id="main" class="learning-wrap course-main"><a class="course-back" href="collect.html">← 收集资源</a><header class="course-hero"><p class="learning-eyebrow">维护工具</p><h1>信息来源</h1><p class="course-sub">看清最近一次检查是否读到了内容。</p></header><p id="sources-status" role="status">正在读取…</p><div id="sources-list"></div><section id="source-editor" class="course-composer" hidden><h2>登记公开来源</h2><form id="source-form"><label>名称<input name="name" required maxlength="160"></label><label>公开网址<input name="url" type="url" required></label><label>所属部门<input name="department" maxlength="120" placeholder="例如：图书馆"></label><label>维护人<input name="maintainer" maxlength="100"></label><label>接入方式<select name="kind"><option value="rss">RSS / Atom 订阅</option><option value="html">网页链接目录</option></select></label><label>内容类型<select name="entry_kind"><option value="resource">学习资料</option><option value="news">公开通知</option><option value="contest">竞赛机会</option><option value="paper">论文索引</option></select></label><label>检查间隔（小时）<input type="number" name="interval_hours" min="1" max="720" value="24" required></label><label class="course-consent"><input type="checkbox" name="enabled">启用定期检查（需要采集服务运行）</label><button class="btn btn-primary" type="submit">登记来源</button><p id="source-form-status" role="status"></p></form></section></main></body></html>

<!doctype html><html lang="zh-CN"><head><!-- @include head --><title>校圈 · Luokixi</title><script type="module" src="/src/pages/circle.js"></script></head><body data-page="circle"><!-- @include nav --><main id="main" class="circle-app">
<header class="circle-hero"><div><p class="section-label">PEOPLE MAKE A CAMPUS.</p><h1>在矿大，<br>找到同频的人。</h1></div><p>一起讨论，也一起创造。<br>从一门课的真实体验，<br>到一个刚萌芽的点子。</p></header>
<div class="circle-switch"><a class="is-active" href="circle.html">校内论坛</a><a href="reputation.html">教师口碑 <span>★</span></a><a href="reputation.html?view=courses">课程评价</a><button class="btn btn-primary" id="circle-compose">＋ 发一条</button></div>
<div class="circle-layout"><aside class="circle-boards"><label class="section-label" for="circle-campus">我的校区</label><select id="circle-campus"><option value="all">全校</option><option value="xueyuanlu">学院路</option><option value="shahe">沙河</option></select><p class="section-label">兴趣与话题</p><div id="circle-boards"></div><a class="circle-review-link" href="reputation.html"><b>选课前，听听过来人。</b><span>教师照片 · 星级 · 高赞原话 →</span></a></aside>
<section><div class="circle-toolbar"><div id="circle-lanes" class="product-tabs"><button data-lane="recommended" aria-pressed="true">推荐</button><button data-lane="latest" aria-pressed="false">最新</button><button data-lane="following" aria-pressed="false">关注</button><button data-lane="reading" aria-pressed="false">精选阅读</button></div><label class="sr-only" for="circle-q">搜索校圈</label><input id="circle-q" type="search" placeholder="搜索话题与经验"></div><div id="circle-status" role="status"></div><div id="circle-feed"></div><button class="btn btn-secondary" id="circle-more" hidden>继续看看</button></section></div></main>
<dialog id="circle-editor" class="library-dialog" aria-labelledby="circle-editor-title"><div class="section-heading"><h2 id="circle-editor-title">你的经历，值得留下。</h2><button data-close aria-label="关闭">×</button></div><form id="circle-form" class="product-form"><label>发到哪个吧<select id="post-board" name="board" required></select></label><label>校区<select name="campus"><option value="all">全校</option><option value="xueyuanlu">学院路</option><option value="shahe">沙河</option></select></label><label>标题<input name="title" maxlength="160" required></label><label>正文<textarea name="body" rows="7" maxlength="20000" placeholder="经验、问题、进展，或者一个想一起实现的点子。" required></textarea></label><label>兴趣标签<input name="tags" placeholder="机器人、摄影、选课…"></label><label>照片（选填，最多 9 张）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="check-line"><input type="checkbox" name="rights" required>这是我有权分享的内容，不含他人隐私。</label><p id="post-status" role="status"></p><button class="btn btn-primary" type="submit">提交审核</button></form></dialog>
<dialog id="circle-thread" class="library-dialog thread-dialog" aria-label="帖子详情"><button class="thread-close" data-close aria-label="关闭帖子">×</button><div id="thread-body"></div><form id="thread-reply" class="product-form"><label>加入讨论<textarea name="body" rows="3" maxlength="6000" required></textarea></label><button class="btn btn-primary">发表回复</button><p id="reply-status" role="status"></p></form></dialog>
</body></html>

<!doctype html><html lang="zh-CN"><head><!-- @include head --><title>校圈 · Luokixi</title><script type="module" src="/src/pages/circle.js"></script></head><body data-page="circle"><!-- @include nav --><main id="main" class="press-room">
<!-- @include circle-header -->
<section class="press-discovery" aria-label="搜索与热议"><form id="circle-search" class="press-search"><span aria-hidden="true">⌕</span><label class="sr-only" for="circle-q">搜索吧与帖子</label><input id="circle-q" type="search" placeholder="搜索一个吧、一段经历、一个想法" autocomplete="off"><button>搜索</button></form><div class="press-hot"><b>校园热议</b><div id="circle-hot" aria-live="polite">正在整理近期讨论…</div></div></section>
<section id="circle-news" class="press-lead" aria-label="校园新闻"><p>正在读取校园新闻…</p></section>
<div class="press-columns"><aside class="press-side"><details class="press-forums" open><summary>逛吧<span>找到同频的人</span></summary><div id="circle-boards"></div></details><div id="board-info" class="press-board-info" hidden></div></aside><section class="press-discussions" aria-label="校园讨论"><div class="press-feed-head"><div><p class="press-eyebrow">来自矿大同学</p><h2 id="circle-feed-title">大家正在聊</h2></div><button class="press-write" id="circle-compose">＋ 发帖</button></div><div class="press-filter"><label>内容 <select id="circle-lanes"><option value="recommended">为你推荐</option><option value="latest">最新发布</option><option value="following">我的关注</option><option value="reading">精选阅读</option></select></label><label>校区 <select id="circle-campus"><option value="all">全校</option><option value="xueyuanlu">学院路</option><option value="shahe">沙河</option></select></label></div><div id="circle-status" role="status"></div><div id="circle-feed"></div><button class="btn btn-secondary" id="circle-more" hidden>继续看看</button></section></div></main>
<dialog id="circle-editor" class="library-dialog" aria-labelledby="circle-editor-title"><div class="section-heading"><h2 id="circle-editor-title">你的经历，值得留下。</h2><button data-close aria-label="关闭">×</button></div><form id="circle-form" class="product-form"><label>发到哪个吧<select id="post-board" name="board" required></select></label><label>校区<select name="campus"><option value="all">全校</option><option value="xueyuanlu">学院路</option><option value="shahe">沙河</option></select></label><label>标题<input name="title" maxlength="160" required></label><label>正文<textarea name="body" rows="7" maxlength="20000" placeholder="经验、问题、进展，或者一个想一起实现的点子。" required></textarea></label><label>兴趣标签<input name="tags" placeholder="机器人、摄影、选课…"></label><label>照片（选填，最多 9 张）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="check-line"><input type="checkbox" name="rights" required>这是我有权分享的内容，不含他人隐私。</label><p id="post-status" role="status"></p><button class="btn btn-primary" type="submit">提交审核</button></form></dialog>
<dialog id="circle-thread" class="library-dialog thread-dialog" aria-label="帖子详情"><button class="thread-close" data-close aria-label="关闭帖子">×</button><div id="thread-body"></div><form id="thread-reply" class="product-form"><label>加入讨论<textarea name="body" rows="3" maxlength="6000" required></textarea></label><button class="btn btn-primary">发表回复</button><p id="reply-status" role="status"></p></form></dialog>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<!-- @include head -->
<title>发现 · Luokixi</title>
<meta name="description" content="一次看一个开源项目：中文导读、为什么推荐、怎么上手，收藏后按自己的目标生成搭建清单。">
<script type="module" src="/src/pages/discover.js"></script>
</head>
<body data-page="discover" class="is-immersive">
<!-- @include nav -->

<main id="main" class="dc">
  <div class="dc-top">
    <div class="segmented glass-pill" role="group" aria-label="精选分类" id="dc-shelf">
      <button type="button" data-shelf="all" aria-pressed="true">全部</button>
      <button type="button" data-shelf="practical" aria-pressed="false">实用</button>
      <button type="button" data-shelf="creative" aria-pressed="false">新奇</button>
      <button type="button" data-shelf="potential" aria-pressed="false">潜力</button>
    </div>
    <div class="feed-links"><a href="projects.html">搜索项目 ↗</a><a href="contribute.html#project">发布作品 ＋</a></div>
    <p class="dc-status" id="dc-status" role="status"></p>
  </div>

  <!-- 光碟架：有 WebGL 时代替下面的竖滑流（discover.js 决定）。左边简介、下方数据，点光碟展开详细介绍。 -->
  <section class="dg" id="dg" hidden aria-label="项目光碟架">
    <div class="dg-stage" tabindex="0" role="group" aria-roledescription="轮播" aria-label="项目光碟。左右方向键切换，回车展开详细介绍">
      <canvas class="dg-canvas" aria-hidden="true"></canvas>
      <canvas class="dg-scribble" aria-hidden="true"></canvas>
    </div>
    <header class="dg-info">
      <p class="dg-tags" data-f="tags"></p>
      <h1 class="dg-title" data-f="title"></h1>
      <p class="dg-repo num" data-f="repo"></p>
      <p class="dg-intro" data-f="intro"></p>
      <button class="dg-more" type="button" data-act="open">详细介绍 <span aria-hidden="true">→</span></button>
    </header>
    <div class="dg-nav">
      <button class="dg-index-btn" type="button" aria-expanded="false" aria-controls="dg-index">片单 <span class="dg-count num" id="dg-count"></span></button>
    </div>
    <div class="dg-scrim" hidden></div>
    <ol class="dg-index" id="dg-index" hidden></ol>
    <footer class="dg-stats" aria-label="项目数据">
      <div class="dg-stat"><span>GitHub ★</span><b class="num" data-f="gh"></b></div>
      <button class="dg-stat dg-stat-btn" type="button" data-act="save" aria-pressed="false"><span data-f="saveLabel">站内收藏</span><b class="num" data-f="site"></b></button>
      <button class="dg-stat dg-stat-btn" type="button" data-act="comments"><span>评论</span><b class="num" data-f="replies"></b></button>
      <div class="dg-stat"><span>浏览</span><b class="num" data-f="views"></b></div>
    </footer>
    <div class="dg-rail" role="group" aria-label="操作">
      <button type="button" class="dg-rail-btn" data-act="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>下载</span></button>
      <button type="button" class="dg-rail-btn" data-act="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>搭建</span></button>
      <button type="button" class="dg-rail-btn" data-act="hide"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg><span>不感兴趣</span></button>
    </div>
    <article class="dg-detail" id="dg-detail" hidden aria-labelledby="dg-d-title">
      <button class="dg-back" type="button" data-act="close">← 回到光碟架</button>
      <div class="dg-d-scroll" id="dg-d-body"></div>
    </article>
    <p class="dg-live sr-only" aria-live="polite"></p>
  </section>

  <div class="dc-feed" id="dc-feed" tabindex="0" aria-label="项目发现流。用上下方向键切换项目"></div>

  <div class="dc-progress" aria-hidden="true"><i id="dc-progress"></i></div>
  <p class="dc-count num" id="dc-count" aria-live="polite"></p>

  <button class="dc-plan-btn glass" id="dc-plan-btn" type="button" hidden>
    <span>搭建清单</span><span class="num" id="dc-plan-n">0</span><span class="muted">/ 5</span>
  </button>
  <p class="dc-keys" aria-hidden="true"><span class="kbd">↑</span><span class="kbd">↓</span> 切换 <span class="kbd">L</span> 收藏 <span class="kbd">X</span> 不感兴趣 <span class="kbd">G</span> 导读</p>
  <div class="dc-toast glass" id="dc-toast" role="status" aria-live="polite" hidden></div>
</main>

<dialog class="dlg dlg-wide glass dc-sheet" id="dc-guide" aria-labelledby="dc-guide-title">
  <button class="dlg-close" type="button" data-close aria-label="关闭">×</button>
  <div class="dc-sheet-body" id="dc-guide-body"></div>
</dialog>

<dialog class="dlg glass dc-sheet" id="dc-download" aria-labelledby="dc-download-title">
  <button class="dlg-close" type="button" data-close aria-label="关闭">×</button>
  <div class="dc-sheet-body" id="dc-download-body"></div>
</dialog>

<dialog class="dlg glass dc-sheet" id="dc-plan" aria-labelledby="dc-plan-title">
  <button class="dlg-close" type="button" data-close aria-label="关闭">×</button>
  <div class="dc-sheet-body" id="dc-plan-body"></div>
</dialog>
</body>
</html>

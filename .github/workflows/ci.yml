name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:materials
      - run: npm run test:client
      - run: npm run test:motion
      - run: npm run test:projects
      - run: npm run test:planner
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      HUB_DATA_DIR: ${{ runner.temp }}/luokixi-hub
      CAMPUS_DATA_DIR: ${{ runner.temp }}/luokixi-library
      HUB_BACKUP_DIR: ${{ runner.temp }}/luokixi-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            campus/requirements.txt
            campus/hub-requirements.txt
      - run: python -m pip install -r campus/requirements.txt -r campus/hub-requirements.txt
      - run: python campus/manage_hub.py check
      - run: python campus/manage_hub.py makemigrations --check --dry-run
      - run: python campus/manage_hub.py test hub --noinput
      - run: python -m unittest discover -s scripts -p test_art_pipeline.py

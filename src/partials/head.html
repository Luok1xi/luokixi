<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Opt in before deferred bundles load, including the login redirect. -->
<style>@media(prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}</style>
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    try {
      var t = localStorage.getItem('lk-theme');
      if (t === 'light' || t === 'dark') d.dataset.theme = t;
    } catch (e) {}
    // 换页转场的方向（forward / back / same）：上一页换走前记下（shell.js），这里在第一帧之前读出来。
    // 预先渲染的页面要等真正切过来时再读；转场播完就清掉，免得影响页内的其他转场。
    function readDir() {
      try {
        var v = JSON.parse(sessionStorage.getItem('lk-vt') || 'null');
        sessionStorage.removeItem('lk-vt');
        if (v && Date.now() - v.at < 8000) d.dataset.vt = v.dir;
      } catch (e) {}
    }
    if (document.prerendering) document.addEventListener('prerenderingchange', readDir, { once: true });
    else readDir();
    addEventListener('pagereveal', function (e) {
      if (!e.viewTransition) { delete d.dataset.vt; return; }
      var clear = function () { delete d.dataset.vt; };
      e.viewTransition.finished.then(clear, clear);
      e.viewTransition.ready.catch(function () {});
      // 页面在后台时转场可能一直不结束；最多 3 秒后清掉方向，免得影响之后的页内转场
      setTimeout(clear, 3000);
    });
  })();
</script>
<!-- 鼠标停在链接上时提前准备下一页：轻页面直接在后台渲染好（点下去立刻出现，转场不再等空白页），
     重页面（地图、开源流）和带分页快照的校圈只预取文件 -->
<script type="speculationrules">
{"prerender":[{"urls":["materials.html","reputation.html","reputation.html?view=courses","me.html","rules.html"],"eagerness":"moderate"}],
 "prefetch":[{"urls":["./","map.html","circle.html","discover.html"],"eagerness":"moderate"}]}
</script>

<!doctype html><html lang="zh-CN"><head><!-- @include head --><title>AI 工作室 · Luokixi</title><script type="module" src="/src/pages/studio.js"></script></head><body data-page="studio"><!-- @include nav --><main id="main" class="studio-app"><header class="section-heading"><div><p class="section-label">LUOKIXI / CREATOR STUDIO</p><h1>把想法，变成下一版。</h1></div><a href="me.html">返回我的 →</a></header><p class="studio-lead">讨论方案、编写候选代码、查看验证结果。每一步都留在这里，由你决定是否采用。</p><p id="studio-status" role="status">正在核对工作室权限…</p><div id="studio-access" hidden><div id="studio-members" class="studio-members"></div><p id="studio-budget" class="small-note"></p><div class="studio-layout"><aside><div class="section-heading"><h2>工作房间</h2><button class="btn btn-secondary" id="studio-new">＋ 新建</button></div><div id="studio-rooms"></div></aside><section><h2 id="studio-room-title">选择房间，或开始新想法。</h2><div id="studio-messages" aria-live="polite"></div><form id="studio-form" class="product-form" hidden><label>这次希望一起完成什么<textarea name="prompt" rows="4" maxlength="6000" placeholder="描述想解决的问题和你期待的效果…" required></textarea></label><div class="form-pair"><label>工作方式<select name="mode"><option value="discuss">讨论方案</option><option value="work">生成候选代码并检查</option></select></label><label>最多发言轮数<input type="number" name="rounds" min="1" max="6" value="3" required></label></div><fieldset id="studio-seats"><legend>参与成员</legend></fieldset><div class="dialog-actions"><button class="btn btn-outline" id="studio-stop" type="button" hidden>停止本次工作</button><button class="btn btn-primary" id="studio-start" type="submit">开始协作</button></div><p class="small-note">每位 AI 的一次回复计一轮，最多 6 轮。生成的候选修改不会直接覆盖网站或发布。</p></form></section></div></div></main><dialog class="library-dialog" id="studio-create" aria-labelledby="studio-create-title"><div class="section-heading"><h2 id="studio-create-title">一个新的想法。</h2><button id="studio-create-close" aria-label="关闭">×</button></div><form class="product-form" id="studio-create-form"><label>房间名称<input name="title" maxlength="120" required></label><label>背景说明<textarea name="brief" rows="4" maxlength="8000"></textarea></label><label>提供的项目文本文件（每行一个相对路径）<textarea name="files" rows="3" placeholder="src/js/carousel.js"></textarea></label><p class="small-note">只提供与任务有关的文本文件，服务端会检查路径和敏感内容。</p><p id="studio-create-status" role="status"></p><button class="btn btn-primary">创建房间</button></form></dialog></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<!-- @include head -->
<title>Luokixi · 今日矿大</title>
<meta name="description" content="矿大（北京）同学的校园编辑页：精选、校圈热帖、竞赛与机会、选课口碑和开源推荐。">
<script>
  // 开场每个标签页会话只播放一次；返回首页和刷新不再遮挡内容。
  // 脚本接管前先用纯色盖住页面，避免先闪一下首页；4 秒兜底，脚本失败也不会卡住（预先渲染时从切过来那一刻算起）。
  (function () {
    try { if (sessionStorage.getItem('lk-opening-seen')) return; sessionStorage.setItem('lk-opening-seen', '1'); } catch { return; }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = document.documentElement;
    d.classList.add('intro-pending');
    var guard = function () { setTimeout(function () { d.classList.remove('intro-pending'); }, 4000); };
    if (document.prerendering) document.addEventListener('prerenderingchange', guard, { once: true });
    else guard();
  })();
</script>
<style>
  /* 开场遮罩必须内联：样式表由脚本加载，晚于首帧 */
  html.intro-pending { overflow: hidden; }
  html.intro-pending::after { content: ""; position: fixed; inset: 0; z-index: 998; background: #fff; }
  @media (prefers-color-scheme: dark) { html.intro-pending:not([data-theme="light"])::after { background: #000; } }
  html.intro-pending[data-theme="dark"]::after { background: #000; }
</style>
<script type="module" src="/src/pages/today.js"></script>
</head>
<body data-page="home">
<!-- @include nav -->

<main id="main" class="td">
  <section class="hc" id="td-hero" aria-roledescription="carousel" aria-label="精选">
    <div class="hc-viewport"><div class="hc-slide is-active hc-skeleton" aria-hidden="true"><div class="hc-card"></div></div></div>
  </section>

  <div class="wrap td-body">
    <header class="v3-head">
      <p class="v3-date" id="td-date"></p>
      <h1 class="v3-title">今日矿大</h1>
      <div class="v3-tabs" role="tablist" aria-label="首页内容" id="td-tabs">
        <button type="button" role="tab" id="td-tab-picks" data-tab="picks" aria-selected="true" aria-controls="td-panel">推荐</button>
        <button type="button" role="tab" id="td-tab-following" data-tab="following" aria-selected="false" aria-controls="td-panel">关注</button>
        <button type="button" role="tab" id="td-tab-hot" data-tab="hot" aria-selected="false" aria-controls="td-panel">热榜</button>
        <button type="button" role="tab" id="td-tab-chances" data-tab="chances" aria-selected="false" aria-controls="td-panel">机会</button>
        <span class="v3-tabs-bar" aria-hidden="true"></span>
      </div>
    </header>

    <div id="td-panel" role="tabpanel" aria-labelledby="td-tab-picks" aria-live="polite">
      <p class="td-loading">正在载入…</p>
    </div>
  </div>
</main>

<!-- @include footer -->
</body>
</html>
